name: Square Signal Bot

# Запуск раз в 10 минут. GitHub Actions гарантирует "не чаще", но
# во время нагрузки на сервисы GitHub запуск может задержаться на
# несколько минут - для интервалов 4ч/2дня/неделя это не критично.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # позволяет запустить вручную кнопкой "Run workflow" на GitHub
  push:
    branches: [main]  # запуск при любом коммите в main - удобно как замена кнопке "Run workflow" с телефона

# Нужно явно разрешить workflow коммитить изменения обратно в
# репозиторий - см. шаг "Save bot state back to the repository" ниже.
# Это НЕ просто бэкап: каждый запуск воркфлоу - это новая чистая
# виртуалка без памяти о предыдущих запусках, единственный способ
# передать состояние бота (кулдауны, время последних постов по каждому
# формату, прогресс последовательных форматов вроде глоссария) в
# следующий запуск - закоммитить bot_state.db обратно в репозиторий.
# Без этого шага и этого разрешения бот "теряет память" каждые 10
# минут - убирали это по ошибке (см. историю коммитов), вернули назад.
permissions:
  contents: write

# Защита от параллельных запусков - если предыдущий прогон ещё не
# закончился (например, нажали "Run workflow" вручную во время
# обычного запуска по расписанию), новый запуск ждёт очереди вместо
# того чтобы стартовать параллельно. Это и вызывало 409 Conflict
# от Telegram (getUpdates разрешает только одно подключение на бота).
concurrency:
  group: square-signal-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      FOLLOWUP_CHANNEL_USERNAME: ${{ secrets.FOLLOWUP_CHANNEL_USERNAME }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PUBLISH_CHANNEL: ${{ secrets.TELEGRAM_PUBLISH_CHANNEL }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      YOUR_USER_ID: ${{ secrets.YOUR_USER_ID }}
      BINANCE_SQUARE_API_KEY: ${{ secrets.BINANCE_SQUARE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      GROQ_VISION_MODEL: ${{ secrets.GROQ_VISION_MODEL }}
      MIN_POST_INTERVAL_HOURS: ${{ secrets.MIN_POST_INTERVAL_HOURS || '2' }}
      OPINION_INTERVAL_HOURS: ${{ secrets.OPINION_INTERVAL_HOURS }}
      ARTICLE_INTERVAL_HOURS: ${{ secrets.ARTICLE_INTERVAL_HOURS }}
      MIN_SIGNAL_SCORE_TO_PUBLISH: ${{ secrets.MIN_SIGNAL_SCORE_TO_PUBLISH || '70' }}
      ACTIVE_WINDOW_LOOKAHEAD_MINUTES: ${{ secrets.ACTIVE_WINDOW_LOOKAHEAD_MINUTES || '30' }}
      TREASURY_PERIOD_HOURS: ${{ secrets.TREASURY_PERIOD_HOURS || '12' }}
      TREASURY_INTERVAL_HOURS: ${{ secrets.TREASURY_INTERVAL_HOURS || '24' }}
      TREASURY_JITTER_HOURS: ${{ secrets.TREASURY_JITTER_HOURS || '1' }}
      SIGNAL_MAX_AGE_HOURS: ${{ secrets.SIGNAL_MAX_AGE_HOURS || '1' }}
      OUTCOME_MAX_TRACK_HOURS: ${{ secrets.OUTCOME_MAX_TRACK_HOURS || '48' }}
      DEAD_MANS_SWITCH_HOURS: ${{ secrets.DEAD_MANS_SWITCH_HOURS || '24' }}
      ACCURACY_REPORT_INTERVAL_HOURS: ${{ secrets.ACCURACY_REPORT_INTERVAL_HOURS || '168' }}
      ACCURACY_REPORT_JITTER_HOURS: ${{ secrets.ACCURACY_REPORT_JITTER_HOURS || '6' }}
      ACCURACY_REPORT_MIN_CLOSED_SIGNALS: ${{ secrets.ACCURACY_REPORT_MIN_CLOSED_SIGNALS || '5' }}
      LOSS_REVIEW_INTERVAL_HOURS: ${{ secrets.LOSS_REVIEW_INTERVAL_HOURS || '96' }}
      LOSS_REVIEW_JITTER_HOURS: ${{ secrets.LOSS_REVIEW_JITTER_HOURS || '6' }}
      LOSS_REVIEW_LOOKBACK_DAYS: ${{ secrets.LOSS_REVIEW_LOOKBACK_DAYS || '4.5' }}
      LOSS_REVIEW_MIN_LOSSES: ${{ secrets.LOSS_REVIEW_MIN_LOSSES || '1' }}
      INDEX_SIGNAL_INTERVAL_HOURS: ${{ secrets.INDEX_SIGNAL_INTERVAL_HOURS || '8' }}
      INDEX_SIGNAL_JITTER_HOURS: ${{ secrets.INDEX_SIGNAL_JITTER_HOURS || '2' }}
      MIN_INDEX_SIGNAL_SCORE_TO_PUBLISH: ${{ secrets.MIN_INDEX_SIGNAL_SCORE_TO_PUBLISH || '55' }}
      INDEX_SIGNAL_ALERT_COOLDOWN_HOURS: ${{ secrets.INDEX_SIGNAL_ALERT_COOLDOWN_HOURS || '12' }}
      INDEX_SIGNAL_MAX_AGE_HOURS: ${{ secrets.INDEX_SIGNAL_MAX_AGE_HOURS || '2' }}
      # --- Фьючерсы (testnet-автотрейдинг, см. futures_auto_trade.py) ---
      BINANCE_FUTURES_API_KEY: ${{ secrets.BINANCE_FUTURES_API_KEY }}
      BINANCE_FUTURES_API_SECRET: ${{ secrets.BINANCE_FUTURES_API_SECRET }}
      BINANCE_FUTURES_MIN_SIGNAL_SCORE: ${{ secrets.BINANCE_FUTURES_MIN_SIGNAL_SCORE || '80' }}
      BINANCE_FUTURES_RISK_PCT_PER_TRADE: ${{ secrets.BINANCE_FUTURES_RISK_PCT_PER_TRADE || '1.0' }}
      BINANCE_FUTURES_DEFAULT_LEVERAGE: ${{ secrets.BINANCE_FUTURES_DEFAULT_LEVERAGE || '3' }}
      BINANCE_FUTURES_MAX_OPEN_POSITIONS: ${{ secrets.BINANCE_FUTURES_MAX_OPEN_POSITIONS || '3' }}
      BINANCE_FUTURES_MAX_SAME_DIRECTION_POSITIONS: ${{ secrets.BINANCE_FUTURES_MAX_SAME_DIRECTION_POSITIONS || '2' }}
      BINANCE_FUTURES_MAX_DAILY_LOSS_PCT: ${{ secrets.BINANCE_FUTURES_MAX_DAILY_LOSS_PCT || '5.0' }}
      BINANCE_FUTURES_MAX_CONSECUTIVE_LOSSES: ${{ secrets.BINANCE_FUTURES_MAX_CONSECUTIVE_LOSSES || '3' }}
      # --- Спот-ребалансировка портфеля к Treasury Index (см. portfolio_rebalancer.py) ---
      BINANCE_SPOT_API_KEY: ${{ secrets.BINANCE_SPOT_API_KEY }}
      BINANCE_SPOT_API_SECRET: ${{ secrets.BINANCE_SPOT_API_SECRET }}
      PORTFOLIO_REBALANCE_DRIFT_THRESHOLD_PCT: ${{ secrets.PORTFOLIO_REBALANCE_DRIFT_THRESHOLD_PCT || '5.0' }}
      NEWS_SOURCE_CHANNEL: ${{ secrets.NEWS_SOURCE_CHANNEL || 'forklog' }}
      NEWS_TAKE_ENABLED: ${{ secrets.NEWS_TAKE_ENABLED || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one bot check
        run: python main.py --once

      - name: Check open futures positions (testnet)
        # Отдельно от шага открытия новых сделок ниже - см. docstring
        # futures_position_monitor.py. Идёт ПЕРЕД открытием новых, чтобы
        # закрывшиеся позиции успели освободить слот (risk_guard.
        # max_open_positions) и подчистить осиротевший условный ордер
        # до следующей попытки открыть что-то по этому же символу.
        continue-on-error: true
        run: python futures_position_monitor.py

      - name: Run futures auto-trade (testnet)
        # Отдельный скрипт, отдельный вызов scanner.run_scan() - это
        # осознанно (см. docstring futures_auto_trade.py): main.py
        # сканирует только в "активном окне" перед постом, а тут нужен
        # шанс на сделку каждые 10 минут независимо от расписания постов.
        # Дублирования постов не будет - у scanner.py cooldown 4ч на
        # тикер+направление (was_recently_alerted), так что повторный
        # скан почти всегда просто не находит новых кандидатов.
        # Если секреты BINANCE_FUTURES_API_KEY/SECRET не заданы, скрипт
        # сам упадёт с понятной ошибкой - continue-on-error, чтобы это
        # не валило остальной пайплайн (посты должны продолжать выходить).
        continue-on-error: true
        run: python futures_auto_trade.py --live

      - name: Rebalance spot portfolio to Treasury Index (testnet)
        # "По надобности", не по расписанию - portfolio_rebalancer.py сам
        # проверяет отклонение от целевых весов на каждом тике (дёшево -
        # баланс+цены, без ордеров) и торгует, только если максимальное
        # отклонение >= PORTFOLIO_REBALANCE_DRIFT_THRESHOLD_PCT (по
        # умолчанию 5%). Если ключи BINANCE_SPOT_* не заданы - упадёт с
        # понятной ошибкой, continue-on-error не роняет остальной пайплайн.
        continue-on-error: true
        run: python portfolio_rebalancer.py --live

      - name: Send daily ops digest to owner (Telegram)
        # Идёт ПОСЛЕДНИМ из содержательных шагов - после auto-trade и
        # ребалансировки, чтобы дайджест отражал состояние уже с учётом
        # действий этого тика. Троттлинг (не чаще раза в ~сутки) - внутри
        # alerting.send_owner_alert, см. docstring ops_digest.py - поэтому
        # этот шаг безопасно запускать на КАЖДОМ тике, а не заводить для
        # него отдельное расписание.
        if: always()
        continue-on-error: true
        run: python ops_digest.py

      - name: Show queue state (diagnostics)
        if: always()
        run: python check_state.py

      - name: Save bot state back to the repository
        if: always()
        run: |
          git config user.name "square-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bot_state.db
          git diff --quiet --cached || git commit -m "Обновление состояния бота [skip ci]"
          git push