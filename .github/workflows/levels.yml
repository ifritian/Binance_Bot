name: Levels research

# Только вручную (или пуш в research/levels). Уровни, вход по закрытию, 1:1, 4ч, сессия
# (см. levels_research.py). Отчёт - вкладка Summary и ветка
# research-results-levels.
on:
  workflow_dispatch:
  push:
    branches: [research/levels]

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run comparison
        run: python levels_research.py --days 900 --top 30 --out levels_report.md
      - name: Show in summary
        if: always()
        run: cat levels_report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Publish report
        if: always()
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          cp levels_report.md /tmp/levels_report.md
          git checkout --orphan research-results-levels
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/levels_report.md levels_report.md
          git add levels_report.md
          git commit -m "Levels report $(date -u +%F)"
          git push -f origin research-results-levels
