name: Probe sources
on:
  workflow_dispatch:
  push:
    branches: [probe/sources]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python probe_sources.py | tee probe_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          cp probe_report.md /tmp/probe_report.md
          git checkout --orphan probe-results
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/probe_report.md probe_report.md
          git add probe_report.md
          git commit -m "Probe report $(date -u +%F)"
          git push -f origin probe-results
