name: Square Bot B (MissTreasury)

on:
  schedule:
    - cron: "5-59/10 * * * *"     # со сдвигом 5 минут относительно основного аккаунта
  workflow_dispatch:

concurrency:
  group: square-signal-bot-b
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BOT_PROFILE: b
      PROJECT_NAME: MissTreasury
      BINANCE_SQUARE_API_KEY: ${{ secrets.BINANCE_SQUARE_API_KEY_B }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SQUARE_MAX_POSTS_PER_DAY: "6"
      QUICK_SETUP_ENABLED: "true"
      MOVER_SETUPS_ENABLED: "true"
      VOLUME_ALERT_ENABLED: "false"
      SMART_MONEY_WATCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Install ffmpeg (video window only)
        continue-on-error: true
        run: |
          H=$(date -u +%H)
          if [ "$H" -ge 6 ] && [ "$H" -lt 21 ]; then
            command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          fi
      - name: Run bot
        if: ${{ env.BINANCE_SQUARE_API_KEY != '' }}
        run: python main.py --once
      - name: Save state
        if: ${{ always() && env.BINANCE_SQUARE_API_KEY != '' }}
        run: |
          git config user.name "square-bot-b"
          git config user.email "actions@users.noreply.github.com"
          git add bot_state_b.db
          git diff --quiet --cached || git commit -m "Состояние бота B [skip ci]"
          # Основной бот коммитит свою базу каждые ~10 минут, поэтому push часто отклоняется:
          # сохраняем свежую базу, берём актуальный main, кладём базу поверх и пушим снова.
          for attempt in 1 2 3 4 5 6; do
            if git push; then exit 0; fi
            echo "push отклонён (попытка $attempt), синхронизируюсь с main"
            cp bot_state_b.db /tmp/bot_state_b_latest.db
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/bot_state_b_latest.db bot_state_b.db
            git add bot_state_b.db
            git diff --quiet --cached || git commit -m "Состояние бота B [skip ci]"
            sleep $((attempt * 3))
          done
          echo "Не удалось сохранить состояние бота B"
          exit 1
